version: "3"
services:
  airflow:
    build: .
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Bangkok
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    extra_hosts:
      - "db.cmxcszmwgzifybziodup.supabase.co:2406:da14:311:1500:f27a:7530:601b:8284"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./assets/.env:/opt/airflow/assets/.env
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid && airflow standalone"